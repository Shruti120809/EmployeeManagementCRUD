<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in to Employee Management">
  <title>Sign in | Employee Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card" aria-labelledby="loginTitle">
      <a class="auth-brand" href="login.html">
        <img src="assets/brand-mark.svg" alt="" width="42" height="42">
        <span>EmpManage<span class="brand-sub">PEOPLE OPERATIONS</span></span>
      </a>
      <div class="auth-heading">
        <p class="eyebrow">EMPLOYEE MANAGEMENT</p>
        <h1 id="loginTitle">Welcome back</h1>
        <p>Sign in to manage your employee directory.</p>
      </div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="loginEmail">Email address</label>
          <input class="form-control" id="loginEmail" name="email" type="email" maxlength="250" autocomplete="username" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-field">
            <input class="form-control" id="loginPassword" name="password" type="password" maxlength="128" autocomplete="current-password" required>
            <button class="password-toggle" type="button" data-toggle-password="loginPassword" aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
            <div class="invalid-feedback">Enter your password.</div>
          </div>
        </div>
        <div class="auth-options">
          <label class="form-check">
            <input class="form-check-input" type="checkbox" disabled>
            <span class="form-check-label">Remember me</span>
          </label>
          <span class="session-note">Sign-in lasts for this tab only</span>
        </div>
        <div class="alert alert-danger d-none" id="loginError" role="alert"></div>
        <button class="btn btn-primary w-100 auth-submit" id="loginButton" type="submit">
          <span class="button-label">Sign in</span>
          <span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
        </button>
      </form>
      <p class="auth-switch">New to Employee Management? <a href="register.html">Create an account</a></p>
    </section>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
